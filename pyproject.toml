[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "sandbox-executor"
version = "0.1.0"
description = "Minimal secure-ish code execution platform for learning sandbox infrastructure"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "redis>=5.0,<8",
  "docker>=7.1,<8",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
sandbox-worker = "app.worker:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
